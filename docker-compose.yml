services:
  app:
    build: .
    image: tilita-live:1.0.0
    environment:
      PORT: "4205"
      TILITA_ALLOWED_HOSTS: "tilita.bla.io.vn,tilita.bla.io.vn:4205,tilita.bla.io.vn:443"
      TILITA_DATA_DIR: /app/data
    volumes:
      - tilita-data:/app/data
    restart: unless-stopped

volumes:
  tilita-data:

networks:
  # VPS fix 2026-11-24: Docker tren host da het subnet cho network moi
  # ("all predefined address pools have been fully subnetted" - deploy 1+2
  # build xong roi chet o buoc tao network compose-reboot-..._default).
  # Chi gan service vao network external (thu truoc) KHONG du: docker compose
  # van tao network default cua project. Phai dinh nghia lai CHINH network
  # default thanh network external co san (dokploy-network cua Traefik)
  # thi compose moi khong tao network moi nua.
  default:
    external: true
    name: dokploy-network
